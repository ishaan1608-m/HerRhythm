# Project-wide Gradle settings.

# JVM Memory - Increased to prevent thrashing
org.gradle.jvmargs=-Xmx2048m -Xms512m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallel execution
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# AndroidX
android.useAndroidX=true
android.enableJetifier=false

# Kotlin code style
kotlin.code.style=official

# Suppress Jetifier warnings
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
